<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="image-Photoroom (2).png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDAS - Sistema de Control TD (Tiempo de Despacho)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://jsdelivr.net"></script>
    <!-- ExcelJS & FileSaver for Advanced Excel Styling (Black & Gold Theme) -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        @import url('https://googleapis.com');
        
        * {
            font-family: 'Inter', sans-serif;
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }

        /* Custom cell styles corresponding to original Excel sheet */
        .col-confirm { background-color: rgba(139, 195, 74, 0.15); border-color: rgba(139, 195, 74, 0.4); }
        .col-guia { background-color: rgba(253, 216, 53, 0.15); border-color: rgba(253, 216, 53, 0.4); }
        .col-sucursal { background-color: rgba(113, 113, 122, 0.15); border-color: rgba(113, 113, 122, 0.4); }
        .col-despacho { background-color: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); }
        .col-calc { background-color: rgba(24, 24, 27, 0.8); color: #fbbf24; font-family: monospace; font-weight: 700; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col antialiased">

    <!-- HEADER / BRANDING BAR -->
    <header class="bg-zinc-900 border-b border-amber-500/30 sticky top-0 z-30 shadow-lg backdrop-blur bg-opacity-90">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-gradient-to-br from-amber-400 to-amber-600 rounded-xl shadow-md shadow-amber-500/20 text-zinc-950 flex items-center justify-center">
                    <i data-lucide="crown" class="w-7 h-7 stroke-[2.5]"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-2xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-500">
                            MIDAS
                        </h1>
                        <span class="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-xs px-2 py-0.5 rounded-full font-semibold uppercase tracking-wider">
                            Control TD
                        </span>
                    </div>
                    <p class="text-xs text-zinc-400 font-medium">Sistema Inteligente de Tiempo de Despacho & Logística</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
                <button onclick="agregarFila()" class="bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold text-xs sm:text-sm px-3.5 py-2 rounded-lg transition-all shadow-md shadow-amber-500/20 flex items-center gap-2">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>Nuevo Pedido</span>
                </button>
                <button onclick="exportarExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs sm:text-sm px-3.5 py-2 rounded-lg transition-all shadow-md flex items-center gap-2">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-200"></i>
                    <span class="hidden sm:inline">Exportar Excel</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- METRICS CARDS -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-col justify-between">
                <div class="flex justify-between items-start text-zinc-400 mb-2">
                    <span class="text-xs font-semibold uppercase">Total Despachos</span>
                    <i data-lucide="package" class="w-4 h-4 text-amber-400"></i>
                </div>
                <div class="text-2xl font-extrabold text-zinc-100" id="metricTotal">0</div>
                <div class="text-[11px] text-zinc-500 mt-1">Registrados en filtro</div>
            </div>

            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-col justify-between">
                <div class="flex justify-between items-start text-zinc-400 mb-2">
                    <span class="text-xs font-semibold uppercase">TD Promedio Oficina</span>
                    <i data-lucide="building-2" class="w-4 h-4 text-amber-400"></i>
                </div>
                <div class="text-2xl font-extrabold text-amber-400" id="metricOficina">00:00</div>
                <div class="text-[11px] text-zinc-500 mt-1">Confirmación a Guía</div>
            </div>

            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-col justify-between">
                <div class="flex justify-between items-start text-zinc-400 mb-2">
                    <span class="text-xs font-semibold uppercase">TD Promedio Campo</span>
                    <i data-lucide="truck" class="w-4 h-4 text-amber-400"></i>
                </div>
                <div class="text-2xl font-extrabold text-amber-400" id="metricCampo">00:00</div>
                <div class="text-[11px] text-zinc-500 mt-1">Tránsito + Entrega</div>
            </div>

            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-col justify-between">
                <div class="flex justify-between items-start text-zinc-400 mb-2">
                    <span class="text-xs font-semibold uppercase">TD Promedio Total</span>
                    <i data-lucide="clock" class="w-4 h-4 text-emerald-400"></i>
                </div>
                <div class="text-2xl font-extrabold text-emerald-400" id="metricTotalTD">00:00</div>
                <div class="text-[11px] text-zinc-500 mt-1">Tiempo de Ciclo Completo</div>
            </div>
        </div>

        <!-- FILTER & DATE SEARCH BAR -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap items-center gap-3 flex-1 min-w-[280px]">
                <div class="relative flex-1 min-w-[200px]">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400"></i>
                    <input type="text" id="searchInput" onkeyup="filtrarTabla()" placeholder="Buscar cliente o auxiliar..." class="w-full bg-zinc-950 border border-zinc-700 rounded-lg pl-9 pr-4 py-2 text-sm text-zinc-200 focus:outline-none focus:border-amber-500 transition-all">
                </div>
                
                <!-- Date Selector with Dropdown Panel -->
                <div class="relative">
                    <button onclick="toggleDatePickerPanel(event)" class="flex items-center gap-2 bg-zinc-950 border border-zinc-700 hover:border-amber-500/50 rounded-lg px-3 py-2 transition-all">
                        <i data-lucide="calendar" class="w-4 h-4 text-amber-400"></i>
                        <div class="text-left">
                            <span class="block text-[10px] text-zinc-400 font-semibold uppercase leading-none">Fecha TD</span>
                            <span id="selectedDateDisplay" class="text-xs font-semibold text-amber-300">Hoy</span>
                        </div>
                        <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-400 ml-1"></i>
                    </button>

                    <!-- Interactive Calendar Picker Popover -->
                    <div id="datePickerPanel" class="hidden absolute top-full left-0 mt-2 z-50 w-80 bg-zinc-900 border border-zinc-700 rounded-2xl shadow-2xl p-4 space-y-3" onclick="event.stopPropagation()">
                        <div class="flex justify-between items-center border-b border-zinc-800 pb-2.5">
                            <button onclick="changeMonth(-1)" class="p-1 rounded-lg hover:bg-zinc-800 text-zinc-400 hover:text-amber-400 transition-colors">
                                <i data-lucide="chevron-left" class="w-4 h-4"></i>
                            </button>
                            <span id="calendarMonthYear" class="text-xs font-bold text-zinc-100 uppercase tracking-wider flex items-center gap-1.5">
                                <!-- Dynamic Month Year -->
                            </span>
                            <button onclick="changeMonth(1)" class="p-1 rounded-lg hover:bg-zinc-800 text-zinc-400 hover:text-amber-400 transition-colors">
                                <i data-lucide="chevron-right" class="w-4 h-4"></i>
                            </button>
                        </div>

                        <!-- Days Header -->
                        <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-zinc-500 uppercase">
